<!DOCTYPE html>
<html>
<head>
    <title>Asha AI Console</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 50px; text-align: center; width: 350px; }
        .orb { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #8A2BE2, #4B0082); margin: 0 auto 20px; box-shadow: 0 0 30px #8A2BE2; animation: b 2s infinite; }
        @keyframes b { 50% { transform: scale(1.1); filter: brightness(1.2); } }
        button { background: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        #status { font-size: 0.8rem; color: #666; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="glass">
        <div class="orb"></div>
        <h1>ASHA AI</h1>
        <button id="micBtn">START MIC TEST</button>
        <div id="status">Ready.</div>
    </div>

    <script>
        const status = document.getElementById('status');
        const btn = document.getElementById('micBtn');
        let ws;
        let audioCtx;

        btn.onclick = async () => {
            if (ws) return;
            
            // WAKE UP AUDIO CONTEXT
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            status.innerText = "Connecting...";
            ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
            ws.binaryType = "arraybuffer"; // FORCE ARRAYBUFFER
            
            ws.onopen = () => { status.innerText = "Bridge Open. Talk now."; btn.innerText = "LISTENING..."; };
            
            ws.onmessage = async (e) => {
                if (e.data instanceof ArrayBuffer) {
                    try {
                        status.innerText = "Asha is Speaking...";
                        const audioBuffer = await audioCtx.decodeAudioData(e.data);
                        const source = audioCtx.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(audioCtx.destination);
                        source.start();
                    } catch (err) { console.error("Audio Decode Error", err); }
                }
            };

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const micCtx = new AudioContext({ sampleRate: 16000 });
            const source = micCtx.createMediaStreamSource(stream);
            const processor = micCtx.createScriptProcessor(4096, 1, 1);
            
            processor.onaudioprocess = (e) => {
                const input = e.inputBuffer.getChannelData(0);
                const pcm = new Int16Array(input.length);
                for (let i = 0; i < input.length; i++) pcm[i] = input[i] * 0x7FFF;
                if (ws.readyState === WebSocket.OPEN) ws.send(pcm.buffer);
            };

            source.connect(processor);
            processor.connect(micCtx.destination);
        };
    </script>
</body>
</html>
