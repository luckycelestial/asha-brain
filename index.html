<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxAI - Live Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4285f4; --primary-glow: rgba(66, 133, 244, 0.5); --bg: #0a0a0c; --card-bg: rgba(255, 255, 255, 0.05); --text: #ffffff; --text-dim: #9ca3af; --accent: #8ab4f8; --ai-accent: #a855f7; --user-accent: #6366f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; background-image: radial-gradient(circle at 0% 0%, rgba(66, 133, 244, 0.15) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 50%); }
        .container { width: 100%; max-width: 600px; padding: 2rem; display: flex; flex-direction: column; align-items: center; gap: 2rem; }
        .glass-card { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px; padding: 2.5rem; width: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .status-badge { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.6rem 1.2rem; border-radius: 100px; background: rgba(255, 255, 255, 0.03); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 2rem; border: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-dim); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #444; transition: all 0.3s ease; }
        .status-dot.active { background: #10b981; box-shadow: 0 0 15px #10b981; animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .gradient-text { font-family: 'Outfit', sans-serif; font-size: 3rem; font-weight: 600; background: linear-gradient(135deg, #fff 0%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        .visualizer-box { height: 180px; background: rgba(0, 0, 0, 0.3); border-radius: 24px; margin: 2rem 0; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); }
        .wave-container { display: flex; align-items: center; gap: 6px; height: 100px; }
        .wave-bar { width: 5px; height: 15px; background: var(--user-accent); border-radius: 10px; transition: height 0.15s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease; }
        .call-controls { display: flex; flex-direction: column; gap: 1.5rem; align-items: center; }
        .call-btn { width: 90px; height: 90px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.4s; background: #10b981; color: white; box-shadow: 0 15px 35px rgba(16, 185, 129, 0.3); }
        .call-btn.active { background: #ef4444; transform: rotate(135deg); }
        .transcript-box { margin-top: 2.5rem; text-align: left; background: rgba(0, 0, 0, 0.4); padding: 1.5rem; border-radius: 20px; height: 250px; overflow-y: auto; font-size: 0.95rem; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; gap: 0.8rem; }
        .msg { padding: 0.8rem 1.2rem; border-radius: 16px; max-width: 85%; }
        .msg.ai { align-self: flex-start; background: rgba(168, 85, 247, 0.1); border-left: 3px solid var(--ai-accent); color: #e9d5ff; }
        .msg.user { align-self: flex-end; background: rgba(66, 133, 244, 0.1); border-right: 3px solid var(--primary); color: #dbeafe; }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="status-badge"><div id="status-dot" class="status-dot"></div><span id="status-text">Disconnected</span></div>
            <h1 class="gradient-text">VoxAI Live</h1>
            <p style="color: var(--text-dim); font-size: 1.1rem;">Asha 3.1 Personal Assistant</p>
            <div class="visualizer-box"><div id="wave-container" class="wave-container"></div></div>
            <div class="call-controls">
                <button id="call-btn" class="call-btn"><svg viewBox="0 0 24 24" width="38" height="38" fill="currentColor"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg></button>
                <span id="call-label">Start Appointment Call</span>
            </div>
            <div id="transcript" class="transcript-box"></div>
        </div>
    </div>
    <script>
        const callBtn = document.getElementById('call-btn'), callLabel = document.getElementById('call-label'), statusDot = document.getElementById('status-dot'), statusText = document.getElementById('status-text'), transcript = document.getElementById('transcript'), waveContainer = document.getElementById('wave-container');
        for (let i = 0; i < 25; i++) { const bar = document.createElement('div'); bar.className = 'wave-bar'; waveContainer.appendChild(bar); }
        const bars = document.querySelectorAll('.wave-bar');
        let audioContext, stream, socket, isCalling = false, nextPlayTime = 0;

        // POINTING TO OUR PROXY SERVER (NO KEY EXPOSED)
        const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

        async function startCall() {
            isCalling = true; callBtn.classList.add('active'); callLabel.innerText = "End Session"; statusDot.classList.add('active'); statusText.innerText = "Connecting...";
            socket = new WebSocket(WS_URL);
            socket.onopen = () => {
                statusText.innerText = "Active";
                socket.send(JSON.stringify({
                    setup: {
                        model: "models/gemini-3.1-flash-live-preview",
                        system_instruction: { parts: [{ text: "You are Asha. Speak Tanglish. Help book appointments." }] },
                        generation_config: { response_modalities: ["AUDIO"], speech_config: { voice_config: { prebuilt_voice_config: { voice_name: "Lyra" } } } }
                    }
                }));
                initAudio();
            };
            socket.onmessage = async (event) => {
                const response = JSON.parse(event.data);
                if (response.serverContent) {
                    const content = response.serverContent;
                    if (content.modelTurn?.parts) {
                        content.modelTurn.parts.forEach(part => {
                            if (part.inlineData) playAudioChunk(part.inlineData.data);
                            if (part.text) addTranscript("Asha", part.text);
                        });
                    }
                }
            };
        }

        async function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioContext.createMediaStreamSource(stream);
            const processor = audioContext.createScriptProcessor(2048, 1, 1);
            processor.onaudioprocess = (e) => {
                if (!isCalling || socket.readyState !== 1) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const pcmData = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    const sample = Math.max(-1, Math.min(1, inputData[i]));
                    pcmData[i] = sample * 0x7FFF;
                    if (i % 100 === 0) bars[(i/100)%bars.length].style.height = (15 + Math.abs(sample)*120)+'px';
                }
                const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcmData.buffer)));
                socket.send(JSON.stringify({ realtimeInput: { audio: { mimeType: "audio/pcm;rate=16000", data: base64Audio } } }));
            };
            source.connect(processor); processor.connect(audioContext.destination);
        }

        async function playAudioChunk(base64Data) {
            if (!audioContext) return;
            const bytes = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
            const pcm16 = new Int16Array(bytes.buffer), float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768.0;
            const buffer = audioContext.createBuffer(1, float32.length, 24000);
            buffer.getChannelData(0).set(float32);
            const source = audioContext.createBufferSource(); source.buffer = buffer; source.connect(audioContext.destination);
            const startTime = Math.max(audioContext.currentTime, nextPlayTime);
            source.start(startTime); nextPlayTime = startTime + buffer.duration;
            bars.forEach(b => { b.style.height = (15+Math.random()*50)+'px'; b.style.background = 'var(--ai-accent)'; });
        }

        function addTranscript(who, text) {
            const div = document.createElement('div'); div.className = 'msg ' + who.toLowerCase();
            div.innerHTML = `<strong>${who}:</strong> ${text}`;
            transcript.appendChild(div); transcript.scrollTop = transcript.scrollHeight;
        }

        callBtn.addEventListener('click', () => isCalling ? location.reload() : startCall());
    </script>
</body>
</html>
