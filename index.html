<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxAI - Live Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4285f4; --bg: #0a0a0c; --card-bg: rgba(255, 255, 255, 0.05); --text: #ffffff; --text-dim: #9ca3af; --accent: #8ab4f8; --ai-accent: #a855f7; --user-accent: #6366f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; background-image: radial-gradient(circle at 0% 0%, rgba(66, 133, 244, 0.15) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 50%); }
        .main-layout { display: flex; gap: 2rem; width: 100%; max-width: 1000px; padding: 2rem; align-items: flex-start; }
        .glass-card { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px; padding: 2rem; flex: 1; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .side-panel { width: 250px; display: flex; flex-direction: column; gap: 1.5rem; }
        .status-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 1.5rem; text-align: center; backdrop-filter: blur(10px); }
        .mobile-indicator { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; background: #EF4444; }
        .mobile-indicator.online { background: #10B981; box-shadow: 0 0 15px #10B981; }
        .status-badge { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.6rem 1.2rem; border-radius: 100px; background: rgba(255, 255, 255, 0.03); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 2rem; border: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-dim); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
        .status-dot.active { background: #10b981; box-shadow: 0 0 15px #10b981; animation: p 2s infinite; }
        @keyframes p { 50% { transform: scale(1.2); opacity: 0.7; } }
        .gradient-text { font-family: 'Outfit', sans-serif; font-size: 2.5rem; font-weight: 600; background: linear-gradient(135deg, #fff 0%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .visualizer-box { height: 150px; background: rgba(0, 0, 0, 0.3); border-radius: 24px; margin: 1.5rem 0; display: flex; align-items: center; justify-content: center; gap: 5px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); }
        .wave-bar { width: 4px; height: 15px; background: var(--user-accent); border-radius: 10px; transition: height 0.15s; }
        .call-btn { width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer; background: #10b981; color: white; display: flex; align-items: center; justify-content: center; transition: 0.4s; }
        .call-btn.active { background: #ef4444; transform: rotate(135deg); }
        .transcript-box { margin-top: 1.5rem; background: rgba(0, 0, 0, 0.4); padding: 1rem; border-radius: 20px; height: 200px; overflow-y: auto; font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.6rem; }
        .msg { padding: 0.6rem 1rem; border-radius: 12px; max-width: 85%; }
        .msg.ai { align-self: flex-start; background: rgba(168, 85, 247, 0.1); border-left: 2px solid var(--ai-accent); color: #e9d5ff; }
        .msg.user { align-self: flex-end; background: rgba(66, 133, 244, 0.1); border-right: 2px solid var(--primary); color: #dbeafe; }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="glass-card">
            <div class="status-badge"><div id="status-dot" class="status-dot"></div><span id="status-text">Disconnected</span></div>
            <h1 class="gradient-text">VoxAI Live</h1>
            <p style="color: var(--text-dim); font-size: 1rem;">Asha 3.1 Medical Intelligence</p>
            <div class="visualizer-box" id="visualizer"></div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:1rem;">
                <button id="call-btn" class="call-btn"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg></button>
                <span style="font-weight:600; color:var(--text-dim);">Asha Call Test</span>
            </div>
            <div id="transcript" class="transcript-box"></div>
        </div>

        <div class="side-panel">
            <div class="status-card">
                <p style="color:#666; font-size:0.7rem; font-weight:bold; margin-bottom:10px; text-transform:uppercase;">Mobile Uplink</p>
                <div style="display:flex; align-items:center; justify-content:center;">
                    <div id="mobile-dot" class="mobile-indicator"></div>
                    <span id="mobile-text" style="font-weight:600; font-size:0.9rem; color:#888;">Offline</span>
                </div>
            </div>
            <div class="status-card" style="font-size:0.75rem; color:#555; text-align:left;">
                <p>🛰️ <b>Server:</b> Render Cloud</p>
                <p>🧠 <b>Model:</b> Gemini 3.1 A2A</p>
            </div>
        </div>
    </div>

    <script>
        const callBtn = document.getElementById('call-btn'), sDot = document.getElementById('status-dot'), sText = document.getElementById('status-text'), transcript = document.getElementById('transcript'), vis = document.getElementById('visualizer'), mDot = document.getElementById('mobile-dot'), mText = document.getElementById('mobile-text');
        for(let i=0; i<25; i++){ const b=document.createElement('div'); b.className='wave-bar'; vis.appendChild(b); }
        const bars = document.querySelectorAll('.wave-bar');
        let audioContext, socket, isCalling = false, nextPlayTime = 0;

        const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

        // INITIAL CONNECTION TO BRIDGE
        const bridgeWs = new WebSocket(WS_URL);
        bridgeWs.onopen = () => bridgeWs.send("check_mobile");
        bridgeWs.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.type === "mobile_status") {
                    mDot.className = data.online ? 'mobile-indicator online' : 'mobile-indicator';
                    mText.innerText = data.online ? 'CONNECTED' : 'OFFLINE';
                    mText.style.color = data.online ? '#10B981' : '#888';
                }
            } catch(err){}
        };

        async function startCall() {
            isCalling = true; callBtn.classList.add('active'); sDot.classList.add('active'); sText.innerText = "Active";
            socket = new WebSocket(WS_URL);
            socket.onopen = () => {
                socket.send(JSON.stringify({setup:{model:"models/gemini-3.1-flash-live-preview",system_instruction:{parts:[{text:"You are Asha. Speak Tanglish."}]},generation_config:{response_modalities:["AUDIO"],speech_config:{voice_config:{prebuilt_voice_config:{voice_name:"Lyra"}}}}}}));
                initAudio();
            };
            socket.onmessage = async (e) => {
                const resp = JSON.parse(e.data);
                if (resp.serverContent?.modelTurn?.parts) {
                    resp.serverContent.modelTurn.parts.forEach(p => {
                        if (p.inlineData) playAudioChunk(p.inlineData.data);
                        if (p.text) addMsg("Asha", p.text);
                    });
                }
            };
        }

        async function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = audioContext.createMediaStreamSource(stream);
            const proc = audioContext.createScriptProcessor(2048, 1, 1);
            proc.onaudioprocess = (e) => {
                if (!isCalling || socket.readyState !== 1) return;
                const input = e.inputBuffer.getChannelData(0), pcm = new Int16Array(input.length);
                for (let i=0; i<input.length; i++){ const s=Math.max(-1,Math.min(1,input[i])); pcm[i]=s*0x7FFF; if(i%100===0) bars[(i/100)%bars.length].style.height=(15+Math.abs(s)*100)+'px'; }
                socket.send(JSON.stringify({realtimeInput:{audio:{mimeType:"audio/pcm;rate=16000",data:btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)))}}}));
            };
            src.connect(proc); proc.connect(audioContext.destination);
        }

        async function playAudioChunk(base64) {
            if(!audioContext) return;
            const bytes = Uint8Array.from(atob(base64), c=>c.charCodeAt(0)), pcm16 = new Int16Array(bytes.buffer), f32 = new Float32Array(pcm16.length);
            for(let i=0; i<pcm16.length; i++) f32[i] = pcm16[i]/32768.0;
            const buf = audioContext.createBuffer(1, f32.length, 24000); buf.getChannelData(0).set(f32);
            const src = audioContext.createBufferSource(); src.buffer = buf; src.connect(audioContext.destination);
            const start = Math.max(audioContext.currentTime, nextPlayTime); src.start(start); nextPlayTime = start+buf.duration;
            bars.forEach(b => { b.style.height = (15+Math.random()*40)+'px'; b.style.background = 'var(--ai-accent)'; });
        }

        function addMsg(who, text) {
            const d = document.createElement('div'); d.className='msg '+who.toLowerCase(); d.innerHTML=`<strong>${who}:</strong> ${text}`;
            transcript.appendChild(d); transcript.scrollTop = transcript.scrollHeight;
        }

        callBtn.onclick = () => isCalling ? location.reload() : startCall();
    </script>
</body>
</html>
